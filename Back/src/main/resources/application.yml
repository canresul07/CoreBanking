spring:
  application:
    name: CoreBank
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update # Geçici olarak update yapıyoruz (Tablo oluşturulması için)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000 # 15 minutes (15 * 60 * 1000)
  refresh-expiration-days: 7
