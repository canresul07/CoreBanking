<div class="max-w-2xl mx-auto space-y-8">
  
  <!-- Başlık -->
  <div>
    <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Para Transferi</h1>
    <p class="text-slate-500 mt-1">Saniyeler içinde güvenle para gönderin.</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm transition-shadow duration-300 hover:shadow-md p-8 relative overflow-hidden">
    <!-- Dekoratif Arkaplan -->
    <div class="absolute top-[-20%] right-[-10%] w-64 h-64 bg-emerald-50 rounded-full blur-3xl pointer-events-none opacity-50"></div>

    <!-- Hata Mesajı -->
    <div *ngIf="errorMessage" class="mb-6 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm flex items-center gap-3">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      {{ errorMessage }}
    </div>

    <!-- Başarı Mesajı -->
    <div *ngIf="successMessage" class="mb-6 bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-xl text-sm flex items-center gap-3">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      {{ successMessage }}
    </div>

    <form [formGroup]="transferForm" (ngSubmit)="submitTransfer()" class="space-y-6 relative z-10">
      <!-- Gönderici Hesap -->
      <div class="space-y-1.5">
        <label class="text-sm font-semibold text-slate-700 ml-1">Gönderici Hesap</label>
        <select formControlName="fromAccountNumber" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all duration-200">
          <option *ngFor="let acc of myAccounts" [value]="acc.accountNumber">
            {{ acc.accountNumber }} - Bakiye: {{ acc.balance | currency:acc.currency:'symbol':'1.2-2' }}
          </option>
        </select>
        <p *ngIf="transferForm.get('fromAccountNumber')?.invalid && transferForm.get('fromAccountNumber')?.touched" class="text-xs text-red-500 ml-1 mt-1 font-medium">
          Lütfen gönderici hesap seçin.
        </p>
      </div>

      <!-- Alıcı Hesap -->
      <div class="space-y-1.5">
        <label class="text-sm font-semibold text-slate-700 ml-1">Alıcı Hesap Numarası</label>
        <input type="text" formControlName="toAccountNumber" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all duration-200" placeholder="TR00 0000 0000 0000 0000 00" />
        <p *ngIf="transferForm.get('toAccountNumber')?.invalid && transferForm.get('toAccountNumber')?.touched" class="text-xs text-red-500 ml-1 mt-1 font-medium">
          Bu alan zorunludur.
        </p>
      </div>
      <!-- Tutar -->
      <div class="space-y-1.5">
        <label class="text-sm font-semibold text-slate-700 ml-1">Gönderilecek Tutar (₺)</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-emerald-500 font-bold">
            ₺
          </div>
          <input type="number" formControlName="amount" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all duration-200 pl-10 font-bold text-lg text-slate-900 placeholder-slate-300" placeholder="0.00" step="0.01" min="0.01" />
        </div>
        <p *ngIf="transferForm.get('amount')?.invalid && transferForm.get('amount')?.touched" class="text-xs text-red-500 ml-1 mt-1 font-medium">
          Geçerli bir tutar giriniz (min 0.01).
        </p>
      </div>

      <!-- Submit Butonu -->
      <button type="submit" [disabled]="transferForm.invalid || isLoading" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold rounded-xl shadow-sm hover:shadow transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer flex justify-center items-center gap-2 w-full mt-4 py-3.5 text-lg flex justify-center items-center gap-3">
        <ng-container *ngIf="!isLoading">
          <span>Transferi Onayla</span>
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </ng-container>
        <ng-container *ngIf="isLoading">
          <!-- Loading Spinner -->
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          İşleniyor...
        </ng-container>
      </button>

    </form>
  </div>
</div>
