<div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 relative overflow-hidden">
  
  <!-- Dekoratif Arkaplan Şekilleri -->
  <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-emerald-50 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-96 h-96 bg-emerald-50 rounded-full blur-3xl opacity-50 pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10 py-8">
    <!-- Logo Alanı -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Aramıza Katıl</h1>
      <p class="text-slate-500 mt-2">Saniyeler içinde hesabını oluştur.</p>
    </div>

    <!-- Register Kartı -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm transition-shadow duration-300 hover:shadow-md p-8">
      
      <!-- Hata Mesajı -->
      <div *ngIf="errorMessage" class="mb-6 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm flex items-center gap-3">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        {{ errorMessage }}
      </div>

      <!-- Başarı Mesajı -->
      <div *ngIf="successMessage" class="mb-6 bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-xl text-sm flex items-center gap-3">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ successMessage }}
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="register()" class="space-y-5">
        
        <!-- Kullanıcı Adı -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-700 ml-1">Kullanıcı Adı</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-emerald-500 transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <input type="text" formControlName="username" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all duration-200 pl-11" placeholder="Benzersiz bir isim" />
          </div>
          <p *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="text-xs text-red-500 ml-1 mt-1 font-medium">
            En az 3 karakter giriniz.
          </p>
        </div>

        <!-- Email -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-700 ml-1">E-Posta Adresi</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-emerald-500 transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <input type="email" formControlName="email" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all duration-200 pl-11" placeholder="ornek@mail.com" />
          </div>
          <p *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-xs text-red-500 ml-1 mt-1 font-medium">
            Geçerli bir e-posta giriniz.
          </p>
        </div>

        <!-- Şifre -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-700 ml-1">Şifre</label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-emerald-500 transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input type="password" formControlName="password" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all duration-200 pl-11" placeholder="••••••••" />
          </div>
          <p *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-xs text-red-500 ml-1 mt-1 font-medium">
            Şifre en az 6 karakter olmalı.
          </p>
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="registerForm.invalid" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold rounded-xl shadow-sm hover:shadow transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer flex justify-center items-center gap-2 w-full mt-6">
          Hesabımı Oluştur
        </button>

      </form>
    </div>

    <!-- Login Link -->
    <p class="text-center text-slate-500 mt-6 text-sm">
      Zaten bir hesabın var mı? 
      <a routerLink="/login" class="text-emerald-600 font-semibold hover:text-emerald-700 hover:underline transition-colors cursor-pointer">Giriş Yap</a>
    </p>

  </div>
</div>
