<div class="max-w-4xl mx-auto space-y-6">
  <div class="mb-8 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full mb-4">
<div class="max-w-4xl mx-auto space-y-6">
  <div class="mb-8 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    </div>
    <h1 class="text-3xl font-bold text-slate-800">Kredi Başvurusu</h1>
    <p class="text-slate-500 mt-2">Hayallerinizi ertelemeyin. Anında onaylı ihtiyaç kredinize hemen başvurun.</p>
  </div>

  <div class="bg-white rounded-2xl p-8 shadow-sm border border-emerald-50">
    <div *ngIf="successMessage" class="mb-6 bg-emerald-50 text-emerald-700 p-4 rounded-xl border border-emerald-200">
      {{ successMessage }}
    </div>
    
    <div *ngIf="errorMessage" class="mb-6 bg-red-50 text-red-700 p-4 rounded-xl border border-red-200">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loanForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Talep Edilen Tutar (TL)</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">₺</span>
          <input type="number" formControlName="amount" class="w-full pl-8 pr-4 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all outline-none" placeholder="50.000">
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Vade (Ay)</label>
        <select formControlName="term" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all outline-none bg-white">
          <option value="12 Ay">12 Ay</option>
          <option value="24 Ay">24 Ay</option>
          <option value="36 Ay">36 Ay</option>
        </select>
      </div>

      <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 flex justify-between items-center mt-6">
        <div>
          <p class="text-sm text-slate-500">Aylık Taksit Tutarı</p>
          <p class="text-xl font-bold text-emerald-600">{{ monthlyInstallment | currency:'TRY':'symbol':'1.2-2' }}</p>
        </div>
        <div class="text-right">
          <p class="text-sm text-slate-500">Faiz Oranı</p>
          <p class="font-semibold text-slate-700">%3.99</p>
        </div>
      </div>

      <button type="submit" [disabled]="loanForm.invalid || !accountId" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-medium py-3 rounded-xl transition-colors shadow-lg shadow-emerald-200">
        Başvuruyu Tamamla
      </button>
    </form>
  </div>
</div>
