<div class="min-h-screen flex text-slate-800 bg-slate-50">
  <!-- SIDEBAR (Sadece auth olmayan sayfalarda göster) -->
  <aside *ngIf="showSidebar()" class="w-64 flex-shrink-0 bg-white border-r border-slate-200 flex flex-col justify-between transition-all duration-300 shadow-sm z-20">
    <div>
      <!-- Logo Alanı -->
      <div class="h-20 flex items-center px-8 border-b border-slate-100">
        <div class="flex items-center gap-3 cursor-pointer" routerLink="/dashboard">
          <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center shadow-md shadow-emerald-500/20">
            <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <span class="text-xl font-bold text-slate-800 tracking-tight">NexBank</span>
        </div>
      </div>

      <!-- Menü -->
      <nav class="p-4 space-y-1.5 mt-2">
        <a routerLink="/dashboard" routerLinkActive="bg-emerald-50 text-emerald-600" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-emerald-600 transition-colors font-medium cursor-pointer">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
          <span>Dashboard</span>
        </a>
        <a routerLink="/accounts" routerLinkActive="bg-emerald-50 text-emerald-600" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-emerald-600 transition-colors font-medium cursor-pointer">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
          </svg>
          <span>Hesaplar</span>
        </a>
        <a routerLink="/cards" routerLinkActive="bg-emerald-50 text-emerald-600" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-emerald-600 transition-colors font-medium cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
          <span>Kartlarım</span>
        </a>
        <a routerLink="/transactions/transfer" routerLinkActive="bg-emerald-50 text-emerald-600" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-emerald-600 transition-colors font-medium cursor-pointer">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
          </svg>
          <span>Para Transferi</span>
        </a>
        <a routerLink="/loans/apply" routerLinkActive="bg-emerald-50 text-emerald-600" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-emerald-600 transition-colors font-medium cursor-pointer">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>Kredi Başvurusu</span>
        </a>
        <a *ngIf="isAdmin()" routerLink="/admin" routerLinkActive="bg-emerald-50 text-emerald-600" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-emerald-600 transition-colors font-medium cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
          <span>Yönetici Paneli</span>
        </a>
      </nav>
    </div>

    <!-- Alt Menü / Çıkış -->
    <div class="p-4 border-t border-slate-100">
      <button (click)="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:text-red-600 hover:bg-red-50 transition-colors font-medium cursor-pointer">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span>Çıkış Yap</span>
      </button>
    </div>
  </aside>

  <!-- ANA İÇERİK -->
  <main class="flex-1 flex flex-col min-h-screen relative overflow-y-auto w-full">
    
    <!-- Topbar (Sadece auth olmayan sayfalarda göster) -->
    <header *ngIf="showSidebar()" class="h-20 flex items-center justify-between px-8 bg-white/80 backdrop-blur-md sticky top-0 z-10 border-b border-slate-200">
      <div>
        <h2 class="text-xl font-bold text-slate-800 tracking-tight">Genel Bakış</h2>
      </div>
      <div class="flex items-center gap-4">
        <!-- Bildirim İkonu -->
        <button class="p-2 rounded-full hover:bg-slate-100 transition-colors relative text-slate-500 cursor-pointer">
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>
        <!-- Profil Avatarı -->
        <div class="w-10 h-10 rounded-full bg-emerald-100 border border-emerald-200 flex items-center justify-center text-emerald-600 font-bold text-sm cursor-pointer shadow-sm uppercase">
          {{ getInitials() }}
        </div>
      </div>
    </header>

    <!-- ROUTER OUTLET -->
    <div class="flex-1 max-w-7xl mx-auto w-full" [ngClass]="{'p-8': showSidebar(), 'p-0': !showSidebar()}">
      <router-outlet></router-outlet>
    </div>
    
  </main>
</div>
